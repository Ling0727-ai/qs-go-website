name: Publish Winget and Scoop manifests

on:
  push:
    branches: [main]
    paths:
      - public/version.json
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to process, for example v5.0.1-rc1; leave empty to use public/version.json
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read release version
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(jq -r '.version' public/version.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Load release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-event.json

      - name: Generate manifests
        env:
          RELEASE_METADATA_PATH: release-event.json
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGE_ID: Ling0727.QualityScalerGo
          PACKAGE_NAME: QualityScaler-Go
          PACKAGE_PUBLISHER: Ling0727-ai
          WINGET_ASSET_REGEX: ${{ vars.WINGET_ASSET_REGEX }}
          SCOOP_ASSET_REGEX: ${{ vars.SCOOP_ASSET_REGEX }}
        run: node scripts/generate-package-manifests.mjs

      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: package-manifests

      - name: Submit to Winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Ling0727.QualityScalerGo
          release-tag: ${{ steps.release.outputs.tag }}
          fork-user: ${{ github.repository_owner }}
          token: ${{ secrets.WINGET_TOKEN }}
        if: env.WINGET_TOKEN != ''

      - name: Publish Scoop manifest
        run: |
          mkdir -p bucket
          cp package-manifests/scoop/ling0727.qualityscalergo-cpu.json bucket/qualityscaler-go-cpu.json
          cp package-manifests/scoop/ling0727.qualityscalergo-cuda.json bucket/qualityscaler-go-cuda.json
          if [ -f package-manifests/scoop/ling0727.qualityscalergo-directml.json ]; then
            cp package-manifests/scoop/ling0727.qualityscalergo-directml.json bucket/qualityscaler-go-directml.json
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bucket/qualityscaler-go-cpu.json bucket/qualityscaler-go-cuda.json
          if [ -f bucket/qualityscaler-go-directml.json ]; then git add bucket/qualityscaler-go-directml.json; fi
          git diff --cached --quiet || git commit -m "Update QualityScaler-Go to ${{ steps.release.outputs.tag }}"
          git push
