name: Publish Winget and Scoop manifests

on:
  push:
    branches: [main]
    paths:
      - public/version.json
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to process, for example v5.0.1-rc1; leave empty to use public/version.json
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read release version
        id: release
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_RELEASE_TAG" ]; then
            echo "tag=$INPUT_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(jq -r '.version' public/version.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Load release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > release-event.json

      - name: Generate manifests
        env:
          RELEASE_METADATA_PATH: release-event.json
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGE_ID: Ling0727.QualityScalerGo
          PACKAGE_NAME: QualityScaler-Go
          PACKAGE_PUBLISHER: Ling0727-ai
          WINGET_ASSET_REGEX: ${{ vars.WINGET_ASSET_REGEX }}
          SCOOP_ASSET_REGEX: ${{ vars.SCOOP_ASSET_REGEX }}
        run: node scripts/generate-package-manifests.mjs

      - name: Upload generated manifests
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: package-manifests

      - name: Submit to Winget
        if: env.WINGET_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          FORK_OWNER: ${{ github.repository_owner }}
        run: |
          if ! gh api "repos/${FORK_OWNER}/winget-pkgs" >/dev/null 2>&1; then
            gh api --method POST repos/microsoft/winget-pkgs/forks >/dev/null
            for attempt in {1..20}; do
              gh api "repos/${FORK_OWNER}/winget-pkgs" >/dev/null 2>&1 && break
              sleep 3
            done
          fi

          gh auth setup-git
          git clone --depth 1 "https://github.com/${FORK_OWNER}/winget-pkgs.git" winget-pkgs
          cd winget-pkgs
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${FORK_OWNER}/winget-pkgs.git"
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/microsoft/winget-pkgs.git
          else
            git remote add upstream https://github.com/microsoft/winget-pkgs.git
          fi
          git fetch upstream master --depth 1

          SAFE_TAG=$(printf '%s' "$RELEASE_TAG" | tr -c 'A-Za-z0-9._-' '-')
          BRANCH="qualityscaler-go-${SAFE_TAG}"
          git checkout -B "$BRANCH" upstream/master
          cp -R ../package-manifests/winget/manifests/. manifests/

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifests
          if git diff --cached --quiet; then
            echo "Winget manifests are already up to date."
            exit 0
          fi

          git commit -m "New version: Ling0727.QualityScalerGo ${RELEASE_TAG}"
          git push origin "$BRANCH" --force

          EXISTING_PR=$(gh api --method GET repos/microsoft/winget-pkgs/pulls \
            -f head="${FORK_OWNER}:${BRANCH}" \
            -f state=open \
            --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing Winget PR #${EXISTING_PR}."
          else
            if ! gh pr create \
              --repo microsoft/winget-pkgs \
              --base master \
              --head "${FORK_OWNER}:${BRANCH}" \
              --title "New version: Ling0727.QualityScalerGo ${RELEASE_TAG}" \
              --body "Automated submission for QualityScaler-Go CPU and CUDA editions."; then
              EXISTING_PR=$(gh api --method GET repos/microsoft/winget-pkgs/pulls \
                -f head="${FORK_OWNER}:${BRANCH}" \
                -f state=open \
                --jq '.[0].number // empty')
              if [ -z "$EXISTING_PR" ]; then exit 1; fi
              echo "Winget PR #${EXISTING_PR} already exists."
            fi
          fi

      - name: Publish Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p bucket
          cp package-manifests/scoop/ling0727.qualityscalergo-cpu.json bucket/qualityscaler-go-cpu.json
          cp package-manifests/scoop/ling0727.qualityscalergo-cuda.json bucket/qualityscaler-go-cuda.json
          if [ -f package-manifests/scoop/ling0727.qualityscalergo-directml.json ]; then
            cp package-manifests/scoop/ling0727.qualityscalergo-directml.json bucket/qualityscaler-go-directml.json
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          SAFE_TAG=$(printf '%s' "$RELEASE_TAG" | tr -c 'A-Za-z0-9._-' '-')
          BRANCH="scoop-manifests-${SAFE_TAG}"
          git checkout -B "$BRANCH"
          git add bucket/qualityscaler-go-cpu.json bucket/qualityscaler-go-cuda.json
          if [ -f bucket/qualityscaler-go-directml.json ]; then git add bucket/qualityscaler-go-directml.json; fi
          if git diff --cached --quiet; then
            echo "Scoop manifests are already up to date."
            exit 0
          fi

          git commit -m "Update QualityScaler-Go to ${RELEASE_TAG}"
          git push origin "$BRANCH" --force

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Updated existing Scoop PR #${EXISTING_PR}."
          else
            if ! gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Update Scoop manifests to ${RELEASE_TAG}" \
              --body "Automated Scoop manifest update for QualityScaler-Go CPU and CUDA editions."; then
              echo "::warning::Scoop branch was pushed, but automatic PR creation is disabled."
              echo "Create it at: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            fi
          fi
