<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#0b1120">
<title>用户手册 — QualityScaler-Go</title>
<meta name="description" content="QualityScaler-Go 完整操作手册：模型选择、参数说明、显存分级、Memory vs Disk 管线对比等。">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="canonical" href="https://qualityscaler-go.lingxin.org/doc/">
<style>
:root {
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
  --radius-xl: 20px; --radius-full: 9999px;
  --font-sans: 'Segoe UI', 'SF Pro Display', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-mono: 'Cascadia Code', 'SF Mono', 'Fira Code', Consolas, monospace;
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"] {
  --bg-body: #070b14; --bg-primary: #0b1120; --bg-secondary: #101827;
  --bg-tertiary: #1c2538; --bg-hover: #18213a; --bg-elevated: #131d33;
  --text-primary: #e2e8f0; --text-secondary: #94a3b8; --text-tertiary: #64748b;
  --accent: #3b82f6; --accent-soft: #60a5fa; --accent-hover: #2563eb;
  --accent-bg: rgba(59,130,246,0.12); --accent-glow: rgba(59,130,246,0.28);
  --border: #1e293b; --border-strong: #334155;
  --glass-bg: rgba(11,17,32,0.6); --glass-border: rgba(30,41,59,0.5);
  --success: #10b981; --success-bg: rgba(16,185,129,0.10);
  --warning: #f59e0b; --warning-bg: rgba(245,158,11,0.10);
  --danger: #ef4444; --danger-bg: rgba(239,68,68,0.10);
  --doc-table-stripe: rgba(30,41,59,0.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font-sans);font-size:15px;line-height:1.6;background:var(--bg-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--accent);text-decoration:none;transition:color var(--transition-fast)}
a:hover{color:var(--accent-soft)}
::selection{background:var(--accent-bg);color:var(--accent)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:10px}

.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--glass-border)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;height:56px;max-width:1120px;margin:0 auto;padding:0 24px}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text-primary)}
.nav-logo img{width:32px;height:32px;border-radius:var(--radius-sm)}
.nav-links{display:flex;align-items:center;gap:28px;list-style:none}
.nav-links a{color:var(--text-secondary);font-size:14px;font-weight:500;transition:color var(--transition-fast)}
.nav-links a:hover{color:var(--text-primary)}
.nav-links a.active{color:var(--accent-soft)}

.doc-wrapper{display:flex;max-width:1120px;margin:0 auto;padding:72px 24px 40px;gap:32px}
.doc-sidebar{width:220px;flex-shrink:0;position:sticky;top:80px;align-self:flex-start;max-height:calc(100vh - 100px);overflow-y:auto;padding-right:8px}
.doc-sidebar nav{display:flex;flex-direction:column;gap:2px}
.doc-sidebar a{display:block;padding:6px 10px;font-size:13px;color:var(--text-tertiary);border-radius:var(--radius-xs);transition:all var(--transition-fast);border-left:2px solid transparent}
.doc-sidebar a:hover{color:var(--text-secondary);background:var(--bg-hover)}
.doc-sidebar a.active{color:var(--accent-soft);background:var(--accent-bg);border-left-color:var(--accent)}
.doc-sidebar .toc-h2{font-weight:600;font-size:13px;padding-left:10px}
.doc-sidebar .toc-h3{padding-left:22px;font-size:12px}

.doc-content{flex:1;min-width:0;max-width:780px}
.doc-content h1{font-size:32px;font-weight:800;letter-spacing:-0.02em;margin-bottom:8px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.doc-content h2{font-size:22px;font-weight:700;margin-top:44px;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border);letter-spacing:-0.01em}
.doc-content h3{font-size:17px;font-weight:600;margin-top:32px;margin-bottom:12px;color:var(--text-secondary)}
.doc-content h4{font-size:15px;font-weight:600;margin-top:24px;margin-bottom:8px}
.doc-content p{margin-bottom:14px;color:var(--text-secondary);line-height:1.75}
.doc-content strong{color:var(--text-primary);font-weight:700}
.doc-content em{color:var(--accent-soft);font-style:normal}
.doc-content a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.doc-content a:hover{color:var(--accent-soft)}
.doc-content blockquote{padding:12px 16px;margin:16px 0;background:var(--bg-secondary);border-left:3px solid var(--accent);border-radius:0 var(--radius-sm) var(--radius-sm) 0;color:var(--text-secondary);font-size:14px}
.doc-content blockquote p{margin-bottom:6px}
.doc-content blockquote p:last-child{margin-bottom:0}
.doc-content code{font-family:var(--font-mono);font-size:13px;background:var(--bg-secondary);padding:2px 6px;border-radius:var(--radius-xs);color:var(--accent-soft)}
.doc-content pre{background:#0d1117;border:1px solid #30363d;border-radius:var(--radius-md);padding:16px 20px;overflow-x:auto;margin:16px 0;font-size:13px;line-height:1.7}
.doc-content pre code{background:none;padding:0;color:var(--text-primary);font-size:13px}
.doc-content ul,.doc-content ol{margin:12px 0 16px 20px;color:var(--text-secondary)}
.doc-content li{margin-bottom:6px;line-height:1.7}
.doc-content li ul,.doc-content li ol{margin-top:4px;margin-bottom:4px}
.doc-content img{max-width:100%;border-radius:var(--radius-md)}
.doc-content hr{margin:36px 0;border:none;border-top:1px solid var(--border)}
.doc-content table{width:100%;border-collapse:collapse;margin:16px 0 24px;font-size:13px;overflow-x:auto;display:block}
.doc-content thead{background:var(--bg-secondary)}
.doc-content th{padding:10px 14px;text-align:left;font-weight:700;font-size:12px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.04em;border-bottom:2px solid var(--border-strong);white-space:nowrap}
.doc-content td{padding:9px 14px;border-bottom:1px solid var(--border);color:var(--text-secondary);white-space:nowrap}
.doc-content tr:nth-child(even) td{background:var(--doc-table-stripe)}
.doc-content tr:hover td{background:var(--bg-hover)}
.doc-content td:first-child, .doc-content th:first-child{white-space:nowrap;font-weight:600;color:var(--text-primary)}

.header-anchor{opacity:0;font-size:18px;margin-left:6px;color:var(--text-tertiary);transition:opacity var(--transition-fast);text-decoration:none}
h2:hover .header-anchor,h3:hover .header-anchor{opacity:1}
.header-anchor:hover{color:var(--accent)}

.doc-footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--border);text-align:center}
.doc-footer a{font-size:14px;color:var(--text-tertiary)}
.doc-footer a:hover{color:var(--text-secondary)}

@media(max-width:860px){
  .doc-wrapper{flex-direction:column;padding-top:68px}
  .doc-sidebar{display:none}
  .doc-content h1{font-size:24px}
  .doc-content h2{font-size:18px}
  .doc-content table{font-size:12px}
  .doc-content th,.doc-content td{padding:6px 8px}
}
</style>
</head>
<body>

<header>
<nav class="nav" aria-label="Main navigation">
  <div class="nav-inner">
    <a href="/" class="nav-logo" aria-label="QualityScaler-Go Home"><img src="/miao.png" alt="QualityScaler-Go" width="32" height="32" decoding="async">QualityScaler-Go</a>
    <ul class="nav-links">
      <li><a href="/#features">Features</a></li>
      <li><a href="/#models">Models</a></li>
      <li><a href="/#download">Download</a></li>
      <li><a href="/doc/" class="active">Docs</a></li>
      <li><a href="https://github.com/Ling0727-ai/qs-go-website" target="_blank" rel="noopener">GitHub</a></li>
    </ul>
  </div>
</nav>
</header>

<main>
<div class="doc-wrapper">
  <aside class="doc-sidebar" id="toc">
    <nav id="tocNav"><span style="color:var(--text-tertiary);font-size:12px">Loading...</span></nav>
  </aside>
  <article class="doc-content" id="docContent">
    <p style="color:var(--text-tertiary)">Loading documentation...</p>
  </article>
</div>
</main>

<footer style="border-top:1px solid var(--border);padding:28px 0;text-align:center">
  <p style="font-size:13px;color:var(--text-tertiary)"><a href="/" style="color:var(--text-tertiary)">← Back to QualityScaler-Go</a></p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
(async function(){
  try {
    var resp = await fetch('/doc/USER_MANUAL.md');
    if (!resp.ok) throw new Error('Failed to load manual: ' + resp.status);
    var md = await resp.text();
    var html = marked.parse(md);

    // Add anchor links to headings
    var tmp = document.createElement('div');
    tmp.innerHTML = html;
    tmp.querySelectorAll('h2,h3').forEach(function(h){
      var id = h.textContent.replace(/\s+/g,'-').replace(/[^\w一-鿿\-]/g,'').toLowerCase();
      h.id = id;
      var a = document.createElement('a');
      a.href = '#' + id;
      a.className = 'header-anchor';
      a.textContent = '#';
      h.appendChild(a);
    });
    document.getElementById('docContent').innerHTML = tmp.innerHTML;

    // Build table of contents
    var toc = document.getElementById('tocNav');
    toc.innerHTML = '';
    var hs = document.querySelectorAll('.doc-content h2,.doc-content h3');
    hs.forEach(function(h){
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent.replace('#','').trim();
      a.className = h.tagName === 'H2' ? 'toc-h2' : 'toc-h3';
      a.addEventListener('click', function(e){
        e.preventDefault();
        h.scrollIntoView({behavior:'smooth',block:'start'});
        history.replaceState(null,'','#'+h.id);
      });
      toc.appendChild(a);
    });

    // Highlight active TOC item on scroll
    var tocLinks = toc.querySelectorAll('a');
    var headings = Array.from(hs).map(function(h){ return { el:h, id:h.id }; });
    window.addEventListener('scroll', function(){
      var scrollY = window.scrollY + 100;
      var active = null;
      for (var i = headings.length-1; i >= 0; i--){
        if (headings[i].el.offsetTop <= scrollY){ active = headings[i].id; break; }
      }
      tocLinks.forEach(function(a){ a.classList.toggle('active', a.getAttribute('href') === '#'+active); });
    });

    // Update page title
    var h1 = document.querySelector('.doc-content h1');
    if (h1) document.title = h1.textContent.replace('#','').trim() + ' — QualityScaler-Go';
  } catch(e){
    document.getElementById('docContent').innerHTML = '<p style="color:var(--danger)">Failed to load documentation: ' + e.message + '</p>';
  }
})();
</script>
</body>
</html>
